[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tracegraph"
version = "0.1.0"
description = "Evidence-first GraphRAG application framework for domain knowledge"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [
    { name = "ensemble", email = "feiyucom@outlook.com" },
]
dependencies = [
    "fastapi>=0.115,<1.0",
    "pypdf>=5.0,<7.0",
    "uvicorn>=0.34,<1.0",
]

[project.optional-dependencies]
graph = [
    "neo4j>=5.28,<7.0",
]
dev = [
    "httpx2>=2.13,<3.0",
    "pytest>=8.3,<10.0",
]

[project.scripts]
tracegraph = "tracegraph.cli:main"

[project.urls]
Homepage = "https://github.com/feiyu1104/TraceGraph"
Repository = "https://github.com/feiyu1104/TraceGraph"
Issues = "https://github.com/feiyu1104/TraceGraph/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"
